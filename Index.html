<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENO MODS STORE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <i class="fa-solid fa-gamepad logo-icon"></i>
      <h1>ZENO <span class="accent">MODS</span></h1>
    </div>
    <div class="search-container">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search mods, rosters, courts...">
    </div>
  </header>

  <main class="content-wrapper">
    
    <div class="announcement-banner">
      <div class="banner-content">
        <h3><i class="fa-solid fa-bullhorn"></i> ZENO MODS UPDATE</h3>
        <p>All NBA 2K20 mods updated to the current 2026 roster structure. Report issues via social pages!</p>
      </div>
    </div>

    <section class="categories-section">
      <div class="section-title">Categories</div>
      <div class="category-slider" id="categorySlider">
        <span class="chip active" data-category="All">All</span>
        <span class="chip" data-category="Rosters">Rosters</span>
        <span class="chip" data-category="Courts">Courts</span>
        <span class="chip" data-category="Jerseys">Jerseys</span>
        <span class="chip" data-category="Cyberfaces">Cyberfaces</span>
        <span class="chip" data-category="Scoreboards">Scoreboards</span>
        <span class="chip" data-category="APK Mods">APK Mods</span>
        <span class="chip" data-category="Tools">Tools</span>
      </div>
    </section>

    <div id="dynamicContent">
      
      <section class="mod-section" id="featuredSection">
        <div class="section-title">Featured Release</div>
        <div id="featuredContainer"></div>
      </section>

      <section class="mod-section">
        <div class="section-title">Latest Uploads</div>
        <div class="grid-layout" id="latestContainer"></div>
      </section>

      <section class="mod-section">
        <div class="section-title">Trending Downloads</div>
        <div class="grid-layout" id="trendingContainer"></div>
      </section>
    </div>

    <div id="extraPages" class="hidden">
      </div>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-target="home">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" data-target="guide">
      <i class="fa-solid fa-book-open"></i>
      <span>Install Guide</span>
    </button>
    <button class="nav-item" data-target="faq">
      <i class="fa-solid fa-circle-question"></i>
      <span>FAQ</span>
    </button>
    <button class="nav-item" data-target="about">
      <i class="fa-solid fa-user"></i>
      <span>About</span>
    </button>
  </nav>

  <script src="apps.js"></script>
  <script src="script.js"></script>
</body>
</html>
